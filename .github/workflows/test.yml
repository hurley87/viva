name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: INV-3 import graph
        run: npm run lint:imports

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p convex/tsconfig.json

      - name: Convex invariant tests
        run: npm run test:once
        env:
          CI: true
